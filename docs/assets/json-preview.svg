    <text x="32" y="92" fill="#58a6ff">PS C:\Lab&gt;</text><text x="150" y="92" fill="#f0f6fc"> .\procsentinel.exe pid 7184 --json | ConvertFrom-Json</text>
    <text x="45" y="138" fill="#79c0ff">pid</text><text x="220" y="138" fill="#f0f6fc">: 7184</text>
    <text x="45" y="170" fill="#79c0ff">parent_pid</text><text x="220" y="170" fill="#f0f6fc">: 4128</text>
    <text x="45" y="202" fill="#79c0ff">image</text><text x="220" y="202" fill="#f0f6fc">: packed-demo.exe</text>
    <text x="45" y="234" fill="#79c0ff">integrity</text><text x="220" y="234" fill="#f0f6fc">: medium</text>
