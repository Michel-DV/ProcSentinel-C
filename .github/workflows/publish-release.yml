name: Publish portfolio release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        run: |
          tag="v1.0.0"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" "$TARGET_SHA" -m "ProcSentinel-C v1.0.0"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "ProcSentinel-C v1.0.0" --notes "Native C11/WinAPI Windows endpoint and PE triage tool with process metadata, PE analysis, SHA-256, Authenticode verification, TCP ownership correlation, explainable scoring, JSON output, tests and Windows CI."
          fi
